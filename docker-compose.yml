services:
  postgres:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpassword
    networks:
      - keycloak_network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - keycloak_network
    depends_on:
      - postgres

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    command: start
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8888
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpassword
    ports:
      - 8888:8080
    restart: always
    depends_on:
      - postgres
    networks:
      - keycloak_network


  authentification-api:
    image: ${DOCKER_ACCOUNT}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    container_name: authentification_api
    ports:
      - "5157:5157"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5157
    depends_on:
      - postgres
      - keycloak
    networks:
      - keycloak_network

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT}/gestionordinateursapi:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    container_name: gestionordinateurs_api
    ports:
      - "5156:5156"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5156
    depends_on:
      - postgres
      - keycloak
    networks:
      - keycloak_network

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT}/gestionordinateursgateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    container_name: gestionordinateurs_gateway
    ports:
      - "5158:5158"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5158
    depends_on:
      - postgres
      - keycloak
    networks:
      - keycloak_network
    
  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT}/gestionordinateursclient:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    container_name: gestionordinateurs_client
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
    depends_on:
      - postgres
      - keycloak
    networks:
      - keycloak_network

volumes:
  postgres_data:
  pgadmin_data:  
    
networks:
  keycloak_network:
    driver: bridge
 